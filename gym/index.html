<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ember Gym</title>
<meta name="theme-color" content="#d6d8db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/ember.css">
<script src="../config.js"></script>
<script src="../shared/ember.js"></script>
<style>
/* Gym: the week is a row of keys that light up orange on training days. Routines are big keycaps you press to start.
   During a workout every set gets a keycap tick; a slate rest bar slides up after each one. */
.main{display:flex;flex-direction:column;gap:16px;max-width:820px;width:100%}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tab{border:0;border-radius:12px;background:var(--surface);height:48px;box-shadow:var(--key-shadow);font-weight:700;font-size:14px;transition:background .15s,color .15s,transform .08s}
.tab[aria-selected="true"]{background:var(--slate);color:var(--on-slate)}
.tab:active{transform:translateY(2px);box-shadow:none}
.sec-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.sec-h button{border:0;background:none;font:inherit;color:var(--accent);letter-spacing:.1em;padding:4px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{aspect-ratio:1;max-width:100%;border-radius:11px;background:var(--surface);box-shadow:var(--key-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;animation:popIn .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i) * 45ms)}
.wd small{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--muted)}
.wd.on{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 0 #b8380f,0 4px 10px rgba(240,78,30,.25)}
.wd.on small{color:var(--on-accent);opacity:.85}
.wd.today:not(.on){box-shadow:var(--key-shadow),inset 0 0 0 2px var(--accent)}
.wd.future{opacity:.55}
.weekline{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:0 4px;font-size:14px;color:var(--muted)}
.weekline b{font-family:var(--f-display);font-size:1.3rem;color:var(--slate)}

/* resume + start */
.resume{display:flex;align-items:center;gap:14px;background:var(--slate);color:var(--on-slate);border-radius:16px;padding:14px 16px;box-shadow:0 3px 0 #313844;border:0;text-align:left;width:100%;animation:fadeUp .4s ease both}
.resume .pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s ease-in-out infinite}
.resume b{display:block;font-size:16px}.resume small{color:#b9c0c9}
.resume .go{margin-left:auto;font-weight:700;color:var(--accent-2)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,78,30,.5)}50%{box-shadow:0 0 0 8px rgba(240,78,30,0)}}
.startbtn{width:100%;height:54px;font-size:16px}

/* routines */
.routines{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rt{border:0;text-align:left;background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 3px 0 rgba(44,50,60,.2),0 6px 14px rgba(44,50,60,.1);display:flex;flex-direction:column;gap:6px;transition:transform .1s,box-shadow .1s;animation:popIn .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i) * 60ms + 100ms)}
.rt:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)}
@media (hover:hover){.rt:hover{transform:translateY(-2px)}}
.rt .top{display:flex;justify-content:space-between;align-items:center}
.rt h3{margin:0;font-family:var(--f-display);font-size:1.35rem;color:var(--slate)}
.rt .play{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 2px 0 #b8380f}
.rt .play svg{width:16px;height:16px}
.rt p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.rt .last{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seed{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* workout view */
.wo-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wo-name{flex:1;min-width:0;border:0;background:none;font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:-.03em;color:var(--slate);outline:none;padding:0}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.clock i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.ex{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--key-shadow);display:flex;flex-direction:column;gap:8px;animation:fadeUp .35s ease both}
.ex-top{display:flex;align-items:center;gap:8px}
.ex-top h3{margin:0;flex:1;min-width:0;font-family:var(--f-display);font-size:1.15rem;color:var(--slate);overflow-wrap:anywhere}
.ex .hint{font-family:var(--f-mono);font-size:11px}
.sets{display:flex;flex-direction:column;gap:6px}
.sethead,.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.sethead span{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;text-align:center}
.set .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set input{height:44px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;width:100%;min-width:0;outline:none;transition:background .2s,border-color .2s}
.set input:focus{border-color:var(--accent)}
.set input::placeholder{color:var(--faint);font-weight:600}
.tick{width:46px;height:44px;border:0;border-radius:11px;background:var(--surface-2);box-shadow:0 3px 0 rgba(44,50,60,.22);display:grid;place-items:center;color:transparent;transition:background .18s,box-shadow .1s,transform .1s}
.tick svg{width:22px;height:22px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s}
.tick:active{transform:translateY(3px);box-shadow:none}
.set.done .tick{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 #b8380f;animation:keyTap .35s cubic-bezier(.3,1.6,.5,1)}
.set.done .tick svg{stroke-dashoffset:0}
.set.done input{background:var(--accent-soft);border-color:transparent}
.set.pr .n{color:var(--accent);font-weight:700}
.ex-actions{display:flex;gap:8px;justify-content:space-between}
.ex-actions .btn{height:38px;font-size:13px}
.wo-foot{display:flex;flex-direction:column;gap:10px}
.mini{height:36px;padding:0 10px;font-size:12.5px}

/* rest bar */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:min(460px,calc(100% - 32px));background:var(--slate);color:var(--on-slate);border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 34px rgba(44,50,60,.35);overflow:hidden;animation:restIn .4s cubic-bezier(.2,1.3,.4,1) both}
.rest .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:var(--p);transition:width 1s linear}
.rest b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;min-width:62px}
.rest small{color:#b9c0c9;font-size:12px;flex:1}
.rest button{border:0;border-radius:9px;background:rgba(255,255,255,.12);color:var(--on-slate);height:36px;min-width:44px;padding:0 10px;font-weight:700;font-size:13px}
.rest.over{background:var(--accent)}.rest.over small{color:var(--on-accent)}
@keyframes restIn{from{opacity:0;transform:translate(-50%,24px)}}

/* history */
.hist{display:flex;flex-direction:column;gap:14px}
.month h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px;font-weight:500}
.hrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;text-align:left;background:var(--surface);border-radius:13px;padding:10px 12px;box-shadow:var(--key-shadow);margin-bottom:7px;animation:slideIn .4s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i) * 40ms)}
.hdate{width:52px;height:52px;border-radius:11px;background:var(--slate);color:var(--on-slate);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hdate b{font-family:var(--f-display);font-size:20px}.hdate small{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:3px}
.hrow .nm b{display:block;font-weight:700}.hrow .nm small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--on-accent);padding:3px 7px;border-radius:7px;box-shadow:0 2px 0 #b8380f}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skey{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.skey span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.skey b{font-family:var(--f-display);font-size:1.35rem;color:var(--slate);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skey.hot{background:var(--accent)}.skey.hot span,.skey.hot b{color:var(--on-accent)}
.detail-ex{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px dashed var(--line)}
.detail-ex b{font-weight:700}.detail-ex span{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.6}
.prl{display:flex;flex-direction:column;gap:6px}
.prl div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-weight:600}
.prl div span{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}

/* progress */
.exkeys{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.exkeys button{flex:none;border:0;border-radius:10px;background:var(--surface);padding:0 12px;height:38px;font-weight:700;font-size:13px;box-shadow:var(--key-shadow);transition:background .15s,color .15s}
.exkeys button[aria-pressed="true"]{background:var(--slate);color:var(--on-slate)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s cubic-bezier(.3,.8,.3,1) .1s forwards}
.chart .area{fill:url(#gfill);opacity:0;animation:fadeIn .6s .6s forwards}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart .bar{fill:var(--slate);transform-box:fill-box;transform-origin:bottom;animation:barUp .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i) * 50ms)}
.chart .bar.now{fill:var(--accent)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadeIn{to{opacity:1}}@keyframes barUp{from{transform:scaleY(0)}}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.pstats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* pickers */
.plist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;padding:2px}
.pick{display:flex;align-items:center;gap:10px;border:0;width:100%;text-align:left;background:var(--surface-2);border-radius:11px;padding:11px 12px;font-weight:600;box-shadow:0 2px 0 rgba(44,50,60,.12)}
.pick small{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pick.new{background:var(--accent-soft);color:var(--accent)}
.rex{display:flex;flex-direction:column;gap:6px}
.rexrow{display:flex;gap:6px;align-items:center;background:var(--surface-2);border-radius:10px;padding:6px 6px 6px 12px}
.rexrow span{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rexrow button{border:0;width:34px;height:34px;border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.rexrow button svg{width:16px;height:16px}
@media (max-width:640px){.nav .hide-sm{display:none}}
</style>
</head>
<body>
<div class="e-app">
  <header class="e-top" id="homeHead">
    <div class="e-title">
      <div class="eyebrow"><span id="sync" class="sync"><i></i><span id="syncTxt">Connecting…</span></span></div>
      <h1 id="title">Gym</h1>
    </div>
    <nav class="nav"><button class="btn icon gear" id="setBtn" type="button" aria-label="Settings"></button></nav>
  </header>

  <div class="main" id="home">
    <div class="tabs" role="tablist" id="tabs"></div>

    <div id="vTrain">
      <section class="plate"><div class="week" id="week"></div><div class="weekline" id="weekline"></div></section>
      <div style="height:14px"></div>
      <div id="resumeBox"></div>
      <button class="btn primary startbtn spin" id="startEmpty" type="button"></button>
      <div style="height:16px"></div>
      <h2 class="sec-h"><span>Routines</span><button type="button" id="newRoutine">+ New</button></h2>
      <div class="routines" id="routines"></div>
    </div>

    <div id="vHistory" hidden><div class="hist" id="hist"></div></div>

    <div id="vProgress" hidden>
      <div class="exkeys" id="exkeys"></div>
      <section class="card" id="prog"></section>
      <div style="height:14px"></div>
      <section class="card" id="vol"></section>
    </div>
  </div>

  <div class="main" id="workout" hidden>
    <div class="wo-head">
      <input class="wo-name" id="woName" maxlength="60" aria-label="Workout name">
      <div class="clock"><i></i><span id="woClock">0:00</span></div>
    </div>
    <div id="woList" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="wo-foot">
      <button class="btn" id="addEx" type="button"></button>
      <button class="btn primary startbtn" id="finish" type="button">Finish workout</button>
      <div style="display:flex;justify-content:space-between"><button class="btn" id="minimise" type="button">Back to overview</button><button class="btn del" id="discard" type="button">Discard</button></div>
    </div>
  </div>
</div>

<div class="rest" id="rest" hidden aria-live="polite"><div class="bar" id="restBar"></div><b id="restT">1:30</b><small id="restS">Rest</small><button type="button" id="restMinus">−15</button><button type="button" id="restPlus">+15</button><button type="button" id="restSkip">Skip</button></div>

<div class="scrim" id="pkScrim" hidden><div class="sheet" id="pkSheet" role="dialog" aria-modal="true" aria-labelledby="pkH">
  <h2 id="pkH">Add exercise</h2>
  <input class="in" id="pkQ" type="search" placeholder="Search or type a new exercise" autocomplete="off" aria-label="Search exercises">
  <div class="plist" id="pkList"></div>
  <div class="actions"><div class="r"><button type="button" class="btn" id="pkClose">Close</button></div></div>
</div></div>

<div class="scrim" id="rtScrim" hidden><form class="sheet" id="rtSheet" role="dialog" aria-modal="true" aria-labelledby="rtH" autocomplete="off">
  <h2 id="rtH">New routine</h2>
  <div class="field"><label for="rtName">Name</label><input class="in" id="rtName" maxlength="40" placeholder="Push, Upper, Leg day…"></div>
  <div class="field"><span class="lbl">Exercises</span><div class="rex" id="rtEx"></div><button type="button" class="btn" id="rtAdd"></button></div>
  <div class="err" id="rtErr" hidden></div>
  <div class="actions"><button type="button" class="btn del" id="rtDel" hidden>Delete</button><div class="r"><button type="button" class="btn" id="rtCancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></div>
</form></div>

<div class="scrim" id="dtScrim" hidden><div class="sheet" id="dtSheet" role="dialog" aria-modal="true" aria-labelledby="dtH">
  <h2 id="dtH">Workout</h2>
  <div id="dtBody" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="actions"><button type="button" class="btn del" id="dtDel">Delete</button><div class="r"><button type="button" class="btn dark" id="dtClose">Done</button></div></div>
</div></div>

<script>
(function(){
const E=Ember,{$,pad,key,parse,today,DOWS,MONTHS,LS,reduced}=E.util,I=E.ICONS;
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
$("setBtn").innerHTML=I.gear;$("startEmpty").innerHTML=I.plus+"Start empty workout";$("addEx").innerHTML=I.plus+"Add exercise";$("rtAdd").innerHTML=I.plus+"Add exercise";

const LIB=["Bench Press","Incline Dumbbell Press","Overhead Press","Dumbbell Shoulder Press","Lateral Raise","Chest Fly","Push-up","Dips","Tricep Pushdown","Skull Crusher",
 "Deadlift","Barbell Row","Pull-up","Chin-up","Lat Pulldown","Seated Cable Row","Face Pull","Bicep Curl","Hammer Curl",
 "Squat","Front Squat","Leg Press","Romanian Deadlift","Leg Curl","Leg Extension","Walking Lunge","Bulgarian Split Squat","Hip Thrust","Calf Raise",
 "Plank","Hanging Leg Raise","Cable Crunch","Running","Rowing Machine"];
const SPLIT=[["Push",["Bench Press","Overhead Press","Incline Dumbbell Press","Lateral Raise","Tricep Pushdown"]],["Pull",["Deadlift","Pull-up","Barbell Row","Face Pull","Bicep Curl"]],["Legs",["Squat","Romanian Deadlift","Leg Press","Leg Curl","Calf Raise"]]];

let workouts={},routines={},view=LS.get("ember-gym-view","train"),act=null,progEx=LS.get("ember-gym-prog","");
const fmtW=w=>(Math.round(w*100)/100).toString();
const e1=(w,r)=>w>0&&r>0?(r===1?w:w*(1+r/30)):0;
const finished=()=>Object.entries(workouts).filter(([,w])=>w.finishedAt>0).sort((a,b)=>b[1].finishedAt-a[1].finishedAt);
const volume=w=>w.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).reduce((t,x)=>t+x.w*x.r,0),0);
const fmtVol=v=>v>=1000?(v/1000).toFixed(1)+" t":Math.round(v)+" kg";
const dur=w=>{const m=Math.max(1,Math.round(((w.finishedAt||Date.now())-w.startedAt)/60000));return m>=60?Math.floor(m/60)+"h "+pad(m%60)+"m":m+" min"};
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};

/* ---------- history lookups ---------- */
function lastSets(name,excludeId){
  for(const [id,w] of finished()){if(id===excludeId)continue;const ex=w.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());if(ex&&ex.sets.some(s=>s.done))return ex.sets.filter(s=>s.done)}
  return null;
}
function bestE1(name,excludeId){
  let b=0;for(const [id,w] of finished()){if(id===excludeId)continue;w.exercises.forEach(e=>{if(e.name.toLowerCase()===name.toLowerCase())e.sets.forEach(s=>{if(s.done)b=Math.max(b,e1(s.w,s.r))})})}
  return b;
}
const setTxt=s=>(s.w>0?fmtW(s.w)+"×":"")+s.r;

/* ---------- tabs ---------- */
[["train","Train"],["history","History"],["progress","Progress"]].forEach(([v,l])=>{const b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.dataset.v=v;b.textContent=l;
  b.addEventListener("click",()=>{view=v;LS.set("ember-gym-view",v);renderHome(true)});$("tabs").appendChild(b)});

/* ---------- home ---------- */
let shownTitle="";
function renderHome(anim){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  $("vTrain").hidden=view!=="train";$("vHistory").hidden=view!=="history";$("vProgress").hidden=view!=="progress";
  const done=finished();
  // week
  const mon=mondayOf(new Date()),wk=$("week");wk.textContent="";let count=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=key(d);const had=done.some(([,w])=>w.date===k);if(had)count++;

function renderProgress(anim){

  const names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const keys=$("exkeys");keys.textContent="";
  if(!names.length){$("prog").innerHTML='<div class="empty"><b>Nothing to chart yet</b>Finish a couple of workouts and your progress shows here.</div>';$("vol").innerHTML="";return}
  if(!names.includes(progEx))progEx=names[0];
  names.slice(0,20).forEach(n=>{const b=document.createElement("button");b.type="button";b.textContent=n;b.setAttribute("aria-pressed",n===progEx);b.addEventListener("click",()=>{progEx=n;LS.set("ember-gym-prog",n);renderProgress(true)});keys.appendChild(b)});
  // points: best e1RM (or reps for bodyweight) per session, oldest first
  const pts=finished().slice().reverse().map(([,w])=>{const e=w.exercises.find(x=>x.name===progEx);if(!e)return null;
    const top=e.sets.reduce((m,s)=>e1(s.w,s.r)>e1(m.w,m.r)||(e1(m.w,m.r)===0&&s.r>m.r)?s:m,{w:0,r:0});return{date:w.date,v:e1(top.w,top.r)||top.r,top,bw:!e1(top.w,top.r)}}).filter(Boolean).slice(-14);
  const bw=pts.every(p=>p.bw),best=pts.reduce((m,p)=>p.v>m.v?p:m,pts[0]);
  const W=600,H=220,L=40,R=16,T=16,B=28,min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v));
  const padv=(max-min)*.15||Math.max(2.5,max*.1),lo=Math.max(0,Math.floor((min-padv)/5)*5),hi=Math.ceil((max+padv)/5)*5,span=Math.max(1,hi-lo);
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1),y=v=>T+(1-(v-lo)/span)*(H-T-B);

  const area=path+" L"+x(pts.length-1).toFixed(1)+" "+(H-B)+" L"+x(0).toFixed(1)+" "+(H-B)+" Z";
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(x(i)-x(i-1),y(pts[i].v)-y(pts[i-1].v));
  const lab=k=>{const d=parse(k);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
  const svg='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(progEx)+' progress"><defs><linearGradient id="gfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f04e1e" stop-opacity=".28"/><stop offset="1" stop-color="#f04e1e" stop-opacity="0"/></linearGradient></defs>'+
    ticks.map(t=>'<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(y(t)+3).toFixed(1)+'" text-anchor="end">'+Math.round(t)+"</text>").join("")+
    '<path class="area" d="'+area+'"/><path class="ln" d="'+path+'" style="--len:'+Math.ceil(len+1)+(anim?"":";animation:none;stroke-dashoffset:0")+'"/>'+
    pts.map((p,i)=>'<circle class="'+(i===pts.length-1?"end":"pt")+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?5.5:3.5)+'"><title>'+lab(p.date)+": "+setTxt(p.top)+"</title></circle>").join("")+
    '<text x="'+x(0).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(pts.length===1?"middle":"start")+'">'+lab(pts[0].date)+"</text>"+(pts.length>1?'<text x="'+x(pts.length-1).toFixed(1)+'" y="'+(H-8)+'" text-anchor="end">'+lab(pts[pts.length-1].date)+"</text>":"")+"</svg>";
  const last=pts[pts.length-1],first=pts[0],chg=pts.length>1?last.v-first.v:0;
  $("prog").innerHTML='<h2 class="sec-h"><span>'+esc(progEx)+" · "+(bw?"best reps":"estimated 1-rep max")+"</span></h2>"+svg+
    '<div class="pstats"><div class="skey hot"><span>Best set</span><b>'+setTxt(best.top)+"</b></div><div class=\"skey\"><span>"+(bw?"Best reps":"Est. max")+"</span><b>"+(bw?best.v:Math.round(best.v)+" kg")+"</b></div><div class=\"skey\"><span>Change</span><b>"+(chg>0?"+":"")+(bw?chg:Math.round(chg)+" kg")+"</b></div><div class=\"skey\"><span>Sessions</span><b>"+counts[progEx]+"</b></div></div>";
  // weekly volume, last 8 weeks
  const mon=mondayOf(new Date()),weeks=[];for(let i=7;i>=0;i--){const s=new Date(mon);s.setDate(mon.getDate()-7*i);weeks.push({s,v:0})}
  finished().forEach(([,w])=>{const d=parse(w.date);const wk=weeks.find(k=>{const e=new Date(k.s);e.setDate(k.s.getDate()+7);return d>=k.s&&d<e});if(wk)wk.v+=volume(w)});
  const vmax=Math.max(1,...weeks.map(w=>w.v)),VW=600,VH=150,bw2=(VW-40-16)/8;
  const vs='<svg class="chart" viewBox="0 0 '+VW+" "+VH+'" role="img" aria-label="Weekly volume">'+
    '<line class="grid" x1="40" x2="'+(VW-16)+'" y1="'+(VH-24)+'" y2="'+(VH-24)+'"/><text x="32" y="'+(16+3)+'" text-anchor="end">'+fmtVol(vmax).replace(" ","")+"</text>"+
    weeks.map((w,i)=>{const h=w.v/vmax*(VH-24-14);const xx=40+i*bw2+6;return'<rect class="bar'+(i===7?" now":"")+'" style="--i:'+i+(anim?"":";animation:none")+'" x="'+xx.toFixed(1)+'" y="'+(VH-24-h).toFixed(1)+'" width="'+(bw2-12).toFixed(1)+'" height="'+Math.max(h,w.v?2:0).toFixed(1)+'" rx="5"><title>'+lab(key(w.s))+": "+fmtVol(w.v)+"</title></rect>"+(i%2===1||i===7?'<text x="'+(xx+(bw2-12)/2).toFixed(1)+'" y="'+(VH-8)+'" text-anchor="middle">'+(i===7?"This wk":lab(key(w.s)))+"</text>":"")}).join("")+"</svg>";
  $("vol").innerHTML='<h2 class="sec-h"><span>Weekly volume</span><span>'+fmtVol(weeks[7].v)+" this week</span></h2>"+vs;
}

/* ---------- wiring ---------- */
$("startEmpty").addEventListener("click",()=>startWorkout(null));
$("setBtn").addEventListener("click",E.openSettings);
let renderedOnce=false;
E.start({id:"gym",name:"Gym",collections:["workouts","routines"],push:false,
  onData(c,items,why){
    if(c==="workouts"){workouts=Object.assign({},items);if(act&&!$("workout").hidden){const {id,...it}=act;workouts[id]=it}}else routines=items;
    if(!act)renderHome(why==="cache"||why==="sync"&&!renderedOnce);renderedOnce=true;
  }});
})();
</script>
</body>
